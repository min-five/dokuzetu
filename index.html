<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNSロースト診断</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'M PLUS Rounded 1c', sans-serif; }
    body {
      background: radial-gradient(120% 120% at 50% 10%, #1e1b2e 0%, #0c0a14 100%);
      color: #f1f1f5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    .card {
      background: #171524;
      border: 1px solid #2a273f;
      border-radius: 28px;
      width: 100%;
      max-width: 380px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }
    .icon {
      width: 60px; height: 60px;
      margin: 0 auto 16px;
      background: #232038;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 28px;
    }
    h1 { font-size: 1.25rem; font-weight: 800; line-height: 1.4; margin-bottom: 8px; }
    .accent { color: #ff5c77; }
    .desc { font-size: 0.8rem; color: #9a96b3; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: block;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-main { background: linear-gradient(135deg, #ff6b8b, #ff416c); color: #fff; box-shadow: 0 8px 20px rgba(255, 65, 108, 0.35); }
    .btn-sub { background: #232038; color: #b0acca; margin-top: 10px; }
    .btn-choice {
      background: #201d33;
      color: #e5e3f0;
      border: 1px solid #2d2947;
      padding: 13px 16px;
      border-radius: 16px;
      font-size: 0.88rem;
      text-align: left;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .stats {
      background: #110f1c;
      border-radius: 16px;
      padding: 12px 16px;
      margin: 16px 0;
      display: grid;
      gap: 6px;
      font-size: 0.8rem;
    }
    .stats div { display: flex; justify-content: space-between; color: #9a96b3; }
    .stats b { color: #fff; }
    .comment { font-size: 0.85rem; color: #d0cde0; line-height: 1.6; margin-bottom: 20px; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <!-- スタート画面 -->
  <div id="view-start">
    <div class="icon">🔥</div>
    <h1>あなたのネット生態、<br><span class="accent">ズバリ暴きます</span></h1>
    <p class="desc">容赦ない毒舌で痛い実態を判定。<br>質問に直感でお答えください。</p>
    <button class="btn btn-main" onclick="start()">診断をはじめる</button>
  </div>

  <!-- 質問画面 -->
  <div id="view-quiz" class="hidden">
    <p id="q-step" style="font-size: 0.75rem; color: #ff6b8b; font-weight: 700; margin-bottom: 8px;"></p>
    <h2 id="q-txt" style="font-size: 1.05rem; margin-bottom: 20px;"></h2>
    <div id="q-opts"></div>
  </div>

  <!-- 結果画面 -->
  <div id="view-res" class="hidden">
    <div class="icon" id="res-icon">💀</div>
    <p style="font-size: 0.75rem; color: #888;">診断結果</p>
    <h2 id="res-title" class="accent" style="font-size: 1.25rem; margin-bottom: 6px;"></h2>
    <div class="stats">
      <div><span>承認欲求</span><b id="s-ego">0%</b></div>
      <div><span>ネット弁慶度</span><b id="s-shadow">0%</b></div>
      <div><span>現実逃避度</span><b id="s-escape">0%</b></div>
    </div>
    <p id="res-desc" class="comment"></p>
    <a id="btn-share" class="btn btn-main" target="_blank" rel="noopener">𝕏 で晒す</a>
    <button class="btn btn-sub" onclick="restart()">もう一度</button>
  </div>
</div>

<script>
const qs = [
  { q: "深夜2時にSNSを開いたら？", a: [["意味深ポストして即消す", [30, 10, 20]], ["無心で画面をスクロールする", [5, 10, 30]], ["界隈にお気持ち投下", [30, 30, 10]]] },
  { q: "他人の実績自慢を見たら？", a: [["粗探しをして内心見下す", [20, 30, 10]], ["秒速でミュート", [10, 15, 25]], ["対抗して盛った投稿をする", [30, 10, 15]]] },
  { q: "作業・ゲームで負けた時は？", a: [["「味方が弱すぎた」", [20, 30, 20]], ["「設定変えたせいだな」", [15, 10, 25]], ["無言で即ふて寝", [5, 10, 30]]] },
  { q: "PC開いて30分後の状態は？", a: [["YouTube見てる", [5, 10, 30]], ["ツールの設定いじり", [20, 10, 25]], ["「作業する」と宣言したきり", [30, 5, 25]]] }
];

const resList = [
  { t: "承認欲求の亡霊", d: "投稿して5分おきにいいね数見てませんか？実績盛る前にまず作業終わらせなさい。", ico: "👻" },
  { t: "陰湿ネット論客", d: "粗探しして正論パンチ打つ瞬間が一番脳汁出てそう。その鋭い観察眼を自分の生活に向けましょう。", ico: "👾" },
  { t: "現実逃避マスター", d: "「明日から本気出す」を繰り返して今年終わりそう。まずその手元のブラウザを閉じなさい。", ico: "🛌" },
  { t: "形から入る口先モンスター", d: "環境設定やツール集めだけで満足して作品が1個も完成していません。まず手を動かしてください。", ico: "🛠️" },
  { t: "無敵のネットお気持ち係", d: "他人の言動にいちいち突っかからないと気が済まない病気です。一度スマホを置いて散歩に行きましょう。", ico: "💢" },
  { t: "無気力ROM専ゾンビ", d: "何も発信しないくせに他人の動向だけは24時間監視中。タイムライン眺めても人生は1ミリも進みません。", ico: "🧟" }
];

let idx = 0, score = [0, 0, 0];
const $ = (id) => document.getElementById(id);

function show(id) {
  ['view-start', 'view-quiz', 'view-res'].forEach(v => $(v).classList.add('hidden'));
  $(id).classList.remove('hidden');
}

function start() { idx = 0; score = [0, 0, 0]; show('view-quiz'); nextQ(); }

function nextQ() {
  const item = qs[idx];
  $('q-step').textContent = `質問 ${idx + 1}問目`;
  $('q-txt').textContent = item.q;
  $('q-opts').innerHTML = item.a.map((opt, i) => 
    `<button class="btn btn-choice" onclick="ans(${i})">${opt[0]}</button>`
  ).join('');
}

function ans(i) {
  qs[idx].a[i][1].forEach((v, k) => score[k] += v);
  if (++idx < qs.length) nextQ();
  else calc();
}

function calc() {
  const [ego, shadow, escape] = score;
  let resIdx = 0;

  // スコアの組み合わせに応じた判定
  if (ego >= 80 && escape >= 70) resIdx = 3;       // 形から入る口先モンスター
  else if (shadow >= 70 && ego >= 60) resIdx = 4;   // 無敵のネットお気持ち係
  else if (escape >= 90 && ego <= 40) resIdx = 5;   // 無気力ROM専ゾンビ
  else {
    resIdx = score.indexOf(Math.max(...score));     // 亡霊(0), 論客(1), 現実逃避(2)
  }

  const res = resList[resIdx];
  const sum = score.reduce((a, b) => a + b, 0);
  const p = score.map(v => Math.min(99, Math.round((v / sum) * 100) + 5));

  $('res-icon').textContent = res.ico;
  $('res-title').textContent = res.t;
  $('res-desc').textContent = res.d;
  $('s-ego').textContent = `${p[0]}%`;
  $('s-shadow').textContent = `${p[1]}%`;
  $('s-escape').textContent = `${p[2]}%`;

  const txt = `【SNSロースト診断】私の生態は『${res.t}』でした。\n承認欲求: ${p[0]}% / ネット弁慶: ${p[1]}% / 現実逃避: ${p[2]}%\n#SNSロースト診断`;
  $('btn-share').href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(txt)}&url=${encodeURIComponent(location.href)}`;
  show('view-res');
}

function restart() { show('view-start'); }
</script>

</body>
</html>
